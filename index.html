<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback } = React;

const STORAGE_KEY = "dog-tracker-v1";
const AI_STORAGE_KEY = "dog-tracker-ai-config";
const DEFAULT_MODELS = {
  anthropic: "claude-haiku-4-5-20251001",
  gemini: "gemini-flash-latest",
  openai: "gpt-4o-mini",
};
const PROVIDER_LABELS = { anthropic: "Claude (Anthropic)", gemini: "Gemini (Google)", openai: "ChatGPT (OpenAI)" };
const PROVIDER_KEY_URLS = {
  anthropic: "console.anthropic.com/settings/keys",
  gemini: "aistudio.google.com/apikey",
  openai: "platform.openai.com/api-keys",
};

function loadAIConfig() {
  try {
    const raw = localStorage.getItem(AI_STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) {
    return null;
  }
}
function saveAIConfig(cfg) {
  try {
    localStorage.setItem(AI_STORAGE_KEY, JSON.stringify(cfg));
    return true;
  } catch (e) {
    return false;
  }
}
function clearAIConfig() {
  try { localStorage.removeItem(AI_STORAGE_KEY); } catch (e) {}
}

async function callAIProvider({ provider, apiKey, model }, prompt) {
  if (provider === "anthropic") {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "x-api-key": apiKey,
        "anthropic-version": "2023-06-01",
        "content-type": "application/json",
        "anthropic-dangerous-direct-browser-access": "true",
      },
      body: JSON.stringify({ model, max_tokens: 700, messages: [{ role: "user", content: prompt }] }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data?.error?.message || `Claude API error (${res.status})`);
    return (data.content || []).filter((b) => b.type === "text").map((b) => b.text).join("\n\n");
  }
  if (provider === "gemini") {
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data?.error?.message || `Gemini API error (${res.status})`);
    return (data?.candidates?.[0]?.content?.parts || []).map((p) => p.text).join("") || "";
  }
  if (provider === "openai") {
    const res = await fetch("https://api.openai.com/v1/chat/completions", {
      method: "POST",
      headers: { Authorization: `Bearer ${apiKey}`, "Content-Type": "application/json" },
      body: JSON.stringify({ model, messages: [{ role: "user", content: prompt }] }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data?.error?.message || `OpenAI API error (${res.status})`);
    return data?.choices?.[0]?.message?.content || "";
  }
  throw new Error("Unknown provider");
}
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
const todayStr = () => new Date().toISOString().slice(0, 10);

const FIELD_TYPES = {
  scale: { label: "Scale (1–5)" },
  number: { label: "Number" },
  text: { label: "Note only" },
};

function seedState() {
  return { dogs: [], categories: [], entries: [] };
}

function coreCategoryDefs() {
  const f = (label, type, unit) => ({ id: uid(), label, type, unit: unit || "" });
  return [
    { name: "Loose leash walking", fields: () => [f("Duration", "number", "min"), f("Place", "text"), f("Rating", "scale")] },
    { name: "New places", fields: () => [f("Duration", "number", "min"), f("Place", "text"), f("Rating", "scale")] },
  ];
}

function ensureCoreCategories(state) {
  let changed = false;
  const categories = [...state.categories];
  state.dogs.forEach((dog) => {
    coreCategoryDefs().forEach((def) => {
      const exists = categories.some((c) => c.dogId === dog.id && c.name.trim().toLowerCase() === def.name.toLowerCase());
      if (!exists) {
        categories.push({ id: uid(), dogId: dog.id, name: def.name, fields: def.fields() });
        changed = true;
      }
    });
  });
  return { state: { ...state, categories }, changed };
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    let data = raw ? JSON.parse(raw) : seedState();
    const { state: patched, changed } = ensureCoreCategories(data);
    if (changed || !raw) {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(patched)); } catch (e) {}
    }
    return patched;
  } catch (e) {
    console.error("Load failed, using fresh data:", e);
    const { state: seeded } = ensureCoreCategories(seedState());
    return seeded;
  }
}

function saveState(next) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(next));
    return true;
  } catch (e) {
    console.error("Save failed:", e);
    return false;
  }
}

function fmtDate(d) {
  const dt = new Date(d + "T00:00:00");
  return dt.toLocaleDateString(undefined, { month: "short", day: "numeric" });
}

function daysSince(dateStr) {
  const then = new Date(dateStr + "T00:00:00");
  const now = new Date();
  return Math.floor((now - then) / (1000 * 60 * 60 * 24));
}

function fieldTrend(entries, categoryId, fieldId) {
  const vals = entries
    .filter((e) => e.categoryId === categoryId && e.values[fieldId] !== undefined && e.values[fieldId] !== "")
    .sort((a, b) => (a.date < b.date ? -1 : 1))
    .map((e) => Number(e.values[fieldId]))
    .filter((n) => !Number.isNaN(n));
  if (vals.length < 2) return null;
  const mid = Math.ceil(vals.length / 2);
  const first = vals.slice(0, mid);
  const second = vals.slice(mid);
  const avg = (arr) => arr.reduce((a, b) => a + b, 0) / arr.length;
  const a1 = avg(first);
  const a2 = second.length ? avg(second) : a1;
  return { a1, a2, delta: a2 - a1, count: vals.length };
}

const scaleColors = ["#C9CFC0", "#A9BB9C", "#87A874", "#639922", "#3B6D11"];

function ScalePicker({ value, onChange }) {
  return (
    <div style={{ display: "flex", gap: 6 }}>
      {[1, 2, 3, 4, 5].map((n) => (
        <button key={n} type="button" onClick={() => onChange(n)}
          style={{ width: 36, height: 36, borderRadius: 8, border: value === n ? "2px solid #1E2B22" : "1px solid #D7DACB",
            background: value === n ? scaleColors[n - 1] : "#FFFFFF", color: value === n ? "#17240F" : "#5B6459", fontWeight: 500, cursor: "pointer" }}>
          {n}
        </button>
      ))}
    </div>
  );
}

function Modal({ title, onClose, children }) {
  return (
    <div onClick={onClose} style={{ position: "fixed", inset: 0, background: "rgba(20,26,18,0.45)", display: "flex", alignItems: "flex-end", justifyContent: "center", zIndex: 50 }}>
      <div onClick={(e) => e.stopPropagation()} style={{ background: "#FFFFFF", borderRadius: "16px 16px 0 0", width: "100%", maxWidth: 480, maxHeight: "88vh", overflowY: "auto", padding: "20px 20px 28px" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
          <h2 style={{ fontFamily: "'Fraunces', serif", fontSize: 20, fontWeight: 500, margin: 0, color: "#1E2B22" }}>{title}</h2>
          <button onClick={onClose} aria-label="Close" style={{ border: "none", background: "transparent", cursor: "pointer", padding: 4, color: "#5B6459", fontSize: 20 }}>×</button>
        </div>
        {children}
      </div>
    </div>
  );
}

const inputStyle = { width: "100%", padding: "10px 12px", borderRadius: 8, border: "1px solid #D7DACB", fontSize: 15, fontFamily: "'Work Sans', sans-serif", color: "#1E2B22", boxSizing: "border-box", background: "#FBFAF6" };
const labelStyle = { fontSize: 13, color: "#5B6459", marginBottom: 6, display: "block", fontWeight: 500 };

function AddCategoryModal({ dogName, onClose, onSave }) {
  const [name, setName] = useState("");
  const [fields, setFields] = useState([{ id: uid(), label: "", type: "number", unit: "" }]);
  const [error, setError] = useState("");
  const updateField = (id, patch) => setFields((fs) => fs.map((f) => (f.id === id ? { ...f, ...patch } : f)));
  const removeField = (id) => setFields((fs) => fs.filter((f) => f.id !== id));
  const addField = () => setFields((fs) => [...fs, { id: uid(), label: "", type: "number", unit: "" }]);
  const save = () => {
    if (!name.trim()) { setError("Give the training a name first."); return; }
    const cleanFields = fields.filter((f) => f.label.trim());
    if (cleanFields.length === 0) { setError("Add at least one thing you want to track."); return; }
    onSave({ name: name.trim(), fields: cleanFields });
  };
  return (
    <Modal title={`New training for ${dogName}`} onClose={onClose}>
      <label style={labelStyle}>Training name</label>
      <input style={{ ...inputStyle, marginBottom: 16 }} placeholder="Recall training" value={name}
        onChange={(e) => { setName(e.target.value); setError(""); }} />
      <label style={labelStyle}>What do you want to track?</label>
      <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: 12 }}>
        {fields.map((f) => (
          <div key={f.id} style={{ border: "1px solid #EAEAE0", borderRadius: 10, padding: 10 }}>
            <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
              <input style={{ ...inputStyle, flex: 1 }} placeholder="e.g. Recall speed, Distraction level" value={f.label}
                onChange={(e) => updateField(f.id, { label: e.target.value })} />
              {fields.length > 1 && (
                <button onClick={() => removeField(f.id)} aria-label="Remove field" style={{ border: "none", background: "transparent", color: "#B5432E", cursor: "pointer", fontSize: 16 }}>🗑</button>
              )}
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              <select style={{ ...inputStyle, flex: 1 }} value={f.type} onChange={(e) => updateField(f.id, { type: e.target.value })}>
                {Object.entries(FIELD_TYPES).map(([k, v]) => (<option key={k} value={k}>{v.label}</option>))}
              </select>
              {f.type === "number" && (
                <input style={{ ...inputStyle, flex: 1 }} placeholder="unit (sec, m, %) - optional" value={f.unit}
                  onChange={(e) => updateField(f.id, { unit: e.target.value })} />
              )}
            </div>
          </div>
        ))}
      </div>
      <button onClick={addField} style={{ display: "flex", alignItems: "center", gap: 6, background: "transparent", border: "1px dashed #B9BFAE", borderRadius: 8, padding: "8px 12px", color: "#4C6B4F", fontWeight: 500, cursor: "pointer", marginBottom: 16 }}>
        + Add another thing to track
      </button>
      {error && <p style={{ color: "#B5432E", fontSize: 13, marginBottom: 12 }}>{error}</p>}
      <button onClick={save} style={{ width: "100%", padding: "12px", borderRadius: 10, border: "none", background: "#1E2B22", color: "#FFFFFF", fontWeight: 500, fontSize: 15, cursor: "pointer" }}>
        Create training
      </button>
    </Modal>
  );
}

function AddEntryModal({ category, onClose, onSave }) {
  const [date, setDate] = useState(todayStr());
  const [values, setValues] = useState({});
  const [notes, setNotes] = useState("");
  const setVal = (fieldId, v) => setValues((old) => ({ ...old, [fieldId]: v }));
  const save = () => onSave({ date, values, notes: notes.trim() });
  return (
    <Modal title={`Log: ${category.name}`} onClose={onClose}>
      <label style={labelStyle}>Date</label>
      <input type="date" style={{ ...inputStyle, marginBottom: 16 }} value={date} max={todayStr()} onChange={(e) => setDate(e.target.value)} />
      {category.fields.map((f) => (
        <div key={f.id} style={{ marginBottom: 16 }}>
          <label style={labelStyle}>{f.label}{f.unit ? ` (${f.unit})` : ""}</label>
          {f.type === "scale" && <ScalePicker value={values[f.id]} onChange={(v) => setVal(f.id, v)} />}
          {f.type === "number" && <input type="number" inputMode="decimal" style={inputStyle} value={values[f.id] ?? ""} onChange={(e) => setVal(f.id, e.target.value)} />}
          {f.type === "text" && <input type="text" style={inputStyle} value={values[f.id] ?? ""} onChange={(e) => setVal(f.id, e.target.value)} />}
        </div>
      ))}
      <label style={labelStyle}>Notes</label>
      <textarea style={{ ...inputStyle, minHeight: 70, marginBottom: 18, resize: "vertical" }} placeholder="Anything worth remembering about this session" value={notes} onChange={(e) => setNotes(e.target.value)} />
      <button onClick={save} style={{ width: "100%", padding: "12px", borderRadius: 10, border: "none", background: "#1E2B22", color: "#FFFFFF", fontWeight: 500, fontSize: 15, cursor: "pointer" }}>
        Save entry
      </button>
    </Modal>
  );
}

function MiniChart({ data, color }) {
  if (data.length < 2) return null;
  const width = 320, height = 110, padX = 6, padY = 14;
  const values = data.map((d) => d.value);
  const min = Math.min(...values), max = Math.max(...values);
  const range = max - min || 1;
  const stepX = (width - padX * 2) / (data.length - 1);
  const pts = data.map((d, i) => {
    const x = padX + i * stepX;
    const y = height - padY - ((d.value - min) / range) * (height - padY * 2);
    return { x, y, label: d.date, value: d.value };
  });
  const path = pts.map((p, i) => `${i === 0 ? "M" : "L"}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" ");
  return (
    <svg viewBox={`0 0 ${width} ${height}`} style={{ width: "100%", height: 110 }}>
      <path d={path} fill="none" stroke={color} strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round" />
      {pts.map((p, i) => (<circle key={i} cx={p.x} cy={p.y} r="3" fill={color} />))}
      <text x={pts[0].x} y={height - 2} fontSize="10" fill="#8B8F7F">{pts[0].label}</text>
      <text x={pts[pts.length - 1].x} y={height - 2} fontSize="10" fill="#8B8F7F" textAnchor="end">{pts[pts.length - 1].label}</text>
    </svg>
  );
}

function TrendArrow({ delta }) {
  if (Math.abs(delta) < 0.05) return <span style={{ color: "#8B8F7F" }}>→</span>;
  return <span style={{ color: "#5B6459" }}>{delta > 0 ? "↑" : "↓"}</span>;
}

function CategoryCard({ category, entries, accent, accentLight, onAddEntry, onDeleteEntry, onDeleteCategory, onMoveUp, onMoveDown, isFirst, isLast }) {
  const [open, setOpen] = useState(false);
  const [confirmingDelete, setConfirmingDelete] = useState(false);
  const sorted = [...entries].sort((a, b) => (a.date < b.date ? -1 : 1));
  const numericFields = category.fields.filter((f) => f.type !== "text");
  const lastEntry = sorted[sorted.length - 1];

  return (
    <div style={{ background: "#FFFFFF", border: "1px solid #E4E6DA", borderRadius: 14, marginBottom: 14, overflow: "hidden" }}>
      <div style={{ width: "100%", display: "flex", justifyContent: "space-between", alignItems: "center", padding: "10px 10px 10px 16px" }}>
        <button onClick={() => setOpen((o) => !o)} style={{ flex: 1, display: "flex", justifyContent: "space-between", alignItems: "center", background: "transparent", border: "none", cursor: "pointer", textAlign: "left", padding: "4px 0" }}>
          <div>
            <div style={{ fontWeight: 500, fontSize: 16, color: "#1E2B22" }}>{category.name}</div>
            <div style={{ fontSize: 13, color: "#5B6459", marginTop: 2 }}>
              {sorted.length === 0 ? "No entries yet" : `${sorted.length} entr${sorted.length === 1 ? "y" : "ies"} · last ${fmtDate(lastEntry.date)}`}
            </div>
          </div>
        </button>
        <div style={{ display: "flex", alignItems: "center", gap: 0, marginLeft: 6 }}>
          <button onClick={(e) => { e.stopPropagation(); onMoveUp(); }} disabled={isFirst} aria-label="Move up"
            style={{ border: "none", background: "transparent", padding: 6, cursor: isFirst ? "default" : "pointer", color: isFirst ? "#D7DACB" : "#5B6459", fontSize: 14 }}>▲</button>
          <button onClick={(e) => { e.stopPropagation(); onMoveDown(); }} disabled={isLast} aria-label="Move down"
            style={{ border: "none", background: "transparent", padding: 6, cursor: isLast ? "default" : "pointer", color: isLast ? "#D7DACB" : "#5B6459", fontSize: 14 }}>▼</button>
          <button onClick={() => setOpen((o) => !o)} aria-label="Toggle details" style={{ border: "none", background: "transparent", padding: 6, cursor: "pointer", color: "#5B6459", fontSize: 16 }}>
            {open ? "︿" : "﹀"}
          </button>
        </div>
      </div>

      {open && (
        <div style={{ padding: "0 16px 16px" }}>
          {numericFields.map((f) => {
            const chartData = sorted.filter((e) => e.values[f.id] !== undefined && e.values[f.id] !== "").map((e) => ({ date: fmtDate(e.date), value: Number(e.values[f.id]) }));
            if (chartData.length < 2) return null;
            return (
              <div key={f.id} style={{ marginBottom: 18 }}>
                <div style={{ fontSize: 13, color: "#5B6459", marginBottom: 6, fontWeight: 500 }}>{f.label}{f.unit ? ` (${f.unit})` : ""}</div>
                <MiniChart data={chartData} color={accent} />
              </div>
            );
          })}

          <button onClick={onAddEntry} style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 6, width: "100%", padding: "10px", borderRadius: 10, border: "none", background: accentLight, color: accent, fontWeight: 500, fontSize: 14, cursor: "pointer", marginBottom: 14 }}>
            + Log a session
          </button>

          {sorted.length > 0 && (
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {sorted.slice().reverse().map((e) => (
                <div key={e.id} style={{ border: "1px solid #EAEAE0", borderRadius: 10, padding: "10px 12px", fontSize: 13 }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
                    <div style={{ fontWeight: 500, color: "#1E2B22" }}>{fmtDate(e.date)}</div>
                    <button onClick={() => onDeleteEntry(e.id)} aria-label="Delete entry" style={{ border: "none", background: "transparent", color: "#B5432E", cursor: "pointer", padding: 0, fontSize: 13 }}>🗑</button>
                  </div>
                  <div style={{ color: "#5B6459", marginTop: 4, display: "flex", flexWrap: "wrap", gap: 10 }}>
                    {category.fields.map((f) => {
                      const v = e.values[f.id];
                      if (v === undefined || v === "") return null;
                      return (<span key={f.id}>{f.label}: <strong style={{ color: "#1E2B22", fontWeight: 500 }}>{v}{f.unit ? ` ${f.unit}` : ""}</strong></span>);
                    })}
                  </div>
                  {e.notes && <div style={{ color: "#5B6459", marginTop: 6, fontStyle: "italic" }}>{e.notes}</div>}
                </div>
              ))}
            </div>
          )}

          {confirmingDelete ? (
            <div style={{ marginTop: 14, display: "flex", alignItems: "center", gap: 10 }}>
              <span style={{ fontSize: 12, color: "#5B6459" }}>Delete this training and all its entries?</span>
              <button onClick={() => { setConfirmingDelete(false); onDeleteCategory(); }} style={{ border: "none", background: "#B5432E", color: "#FFFFFF", fontSize: 12, fontWeight: 500, borderRadius: 6, padding: "5px 10px", cursor: "pointer" }}>Delete</button>
              <button onClick={() => setConfirmingDelete(false)} style={{ border: "none", background: "transparent", color: "#5B6459", fontSize: 12, cursor: "pointer", padding: 0 }}>Cancel</button>
            </div>
          ) : (
            <button onClick={() => setConfirmingDelete(true)} style={{ marginTop: 14, border: "none", background: "transparent", color: "#A9AA9C", fontSize: 12, cursor: "pointer", padding: 0 }}>
              Delete this training
            </button>
          )}
        </div>
      )}
    </div>
  );
}

function inDateRange(dateStr, range, customStart, customEnd) {
  if (range === "all") return true;
  if (range === "week") {
    const cutoff = new Date();
    cutoff.setDate(cutoff.getDate() - 7);
    return dateStr >= cutoff.toISOString().slice(0, 10);
  }
  if (range === "month") {
    const cutoff = new Date();
    cutoff.setDate(cutoff.getDate() - 30);
    return dateStr >= cutoff.toISOString().slice(0, 10);
  }
  if (range === "custom") {
    if (customStart && dateStr < customStart) return false;
    if (customEnd && dateStr > customEnd) return false;
    return true;
  }
  return true;
}

function AISettingsModal({ config, onClose, onSave, onRemove }) {
  const [provider, setProvider] = useState(config?.provider || "anthropic");
  const [apiKey, setApiKey] = useState(config?.apiKey || "");
  const [model, setModel] = useState(config?.model || DEFAULT_MODELS[config?.provider || "anthropic"]);

  const handleProviderChange = (p) => {
    setProvider(p);
    setModel(DEFAULT_MODELS[p]);
  };

  const save = () => {
    if (!apiKey.trim()) return;
    onSave({ provider, apiKey: apiKey.trim(), model: model.trim() || DEFAULT_MODELS[provider] });
  };

  return (
    <Modal title="AI notes analysis" onClose={onClose}>
      <p style={{ fontSize: 13, color: "#5B6459", marginBottom: 14 }}>
        Paste your own API key. It's saved only in this browser's storage and sent directly from your device to the provider when you analyze notes — never through us, never in the GitHub repo.
      </p>
      <label style={labelStyle}>Provider</label>
      <select style={{ ...inputStyle, marginBottom: 6 }} value={provider} onChange={(e) => handleProviderChange(e.target.value)}>
        {Object.entries(PROVIDER_LABELS).map(([k, v]) => (<option key={k} value={k}>{v}</option>))}
      </select>
      <p style={{ fontSize: 12, color: "#8B8F7F", marginBottom: 14 }}>Get a key at {PROVIDER_KEY_URLS[provider]}</p>

      <label style={labelStyle}>API key</label>
      <input type="password" style={{ ...inputStyle, marginBottom: 14 }} value={apiKey} onChange={(e) => setApiKey(e.target.value)} placeholder="Paste your key here" autoComplete="off" />

      <label style={labelStyle}>Model (defaults are fine, only change if needed)</label>
      <input type="text" style={{ ...inputStyle, marginBottom: 18 }} value={model} onChange={(e) => setModel(e.target.value)} />

      <button onClick={save} disabled={!apiKey.trim()} style={{ width: "100%", padding: "12px", borderRadius: 10, border: "none", background: apiKey.trim() ? "#1E2B22" : "#D7DACB", color: "#FFFFFF", fontWeight: 500, fontSize: 15, cursor: apiKey.trim() ? "pointer" : "default" }}>
        Save
      </button>
      {config?.apiKey && (
        <button onClick={onRemove} style={{ width: "100%", marginTop: 10, padding: "10px", borderRadius: 10, border: "1px solid #E0C3A6", background: "transparent", color: "#8A4A1F", fontWeight: 500, fontSize: 14, cursor: "pointer" }}>
          Remove saved key
        </button>
      )}
    </Modal>
  );
}

function AnalysisView({ dog, categories, entries, accent, accentLight, aiConfig, onOpenAISettings }) {
  const [scope, setScope] = useState("all");
  const [range, setRange] = useState("all");
  const [customStart, setCustomStart] = useState("");
  const [customEnd, setCustomEnd] = useState("");
  const [copied, setCopied] = useState(false);
  const [aiLoading, setAiLoading] = useState(false);
  const [aiResult, setAiResult] = useState(null);
  const [aiError, setAiError] = useState("");

  const scopedCategories = scope === "all" ? categories : categories.filter((c) => c.id === scope);
  const scopedCategoryIds = new Set(scopedCategories.map((c) => c.id));
  const scopedEntries = entries.filter((e) => scopedCategoryIds.has(e.categoryId));
  const rangedEntries = scopedEntries.filter((e) => inDateRange(e.date, range, customStart, customEnd));
  const dates = rangedEntries.map((e) => e.date).sort();
  const firstDate = dates[0], lastDate = dates[dates.length - 1];

  const staleCats = scope === "all" ? categories.filter((c) => {
    const catEntries = entries.filter((e) => e.categoryId === c.id);
    if (catEntries.length === 0) return true;
    const last = catEntries.map((e) => e.date).sort().slice(-1)[0];
    return daysSince(last) > 10;
  }) : [];

  const buildNotesPrompt = () => {
    const notesEntries = rangedEntries.filter((e) => e.notes && e.notes.trim());
    if (notesEntries.length === 0) return null;
    const catName = (id) => categories.find((c) => c.id === id)?.name || "";
    const sorted = [...notesEntries].sort((a, b) => (a.date < b.date ? -1 : 1));
    const scopeLabel = scope === "all" ? "across all training types" : `for "${scopedCategories[0]?.name}" sessions`;
    const transcript = sorted.map((e) => `${e.date} — ${catName(e.categoryId)}: ${e.notes}`).join("\n");
    return {
      notesEntries,
      text: `Here are my dated training journal notes for my dog ${dog.name}, ${scopeLabel}. Please identify recurring triggers or patterns, signs of progress over time, and anything worth watching or adjusting:\n\n${transcript}`,
    };
  };

  const copyNotes = async () => {
    const built = buildNotesPrompt();
    if (!built) return;
    try {
      await navigator.clipboard.writeText(built.text);
      setCopied(true);
      setTimeout(() => setCopied(false), 2500);
    } catch (e) {
      alert("Couldn't copy automatically — please select and copy the notes manually.");
    }
  };

  const runAIAnalysis = async () => {
    const built = buildNotesPrompt();
    if (!built || !aiConfig?.apiKey) return;
    setAiLoading(true);
    setAiError("");
    setAiResult(null);
    try {
      const prompt = `${built.text}\n\nIn plain, concise language (short paragraphs or a short bullet list, no headers, no markdown bold), identify: 1) recurring triggers or patterns, 2) signs of progress over time, 3) anything worth watching or adjusting. Base this only on what's in the notes. Keep it under 180 words.`;
      const text = await callAIProvider(aiConfig, prompt);
      setAiResult(text || "No insights could be generated from these notes.");
    } catch (e) {
      console.error("AI analysis failed:", e);
      setAiError(e.message || "Couldn't reach the AI provider. Check your API key and try again.");
    } finally {
      setAiLoading(false);
    }
  };

  const notesEntries = rangedEntries.filter((e) => e.notes && e.notes.trim());

  const rangeOptions = [
    { key: "all", label: "All time" },
    { key: "week", label: "Last week" },
    { key: "month", label: "Last month" },
    { key: "custom", label: "Custom" },
  ];

  return (
    <div>
      <label style={{ ...labelStyle, marginBottom: 8 }}>Scope</label>
      <select style={{ ...inputStyle, marginBottom: 14 }} value={scope} onChange={(e) => { setScope(e.target.value); setCopied(false); }}>
        <option value="all">All trainings — overall</option>
        {categories.map((c) => (<option key={c.id} value={c.id}>{c.name}</option>))}
      </select>

      <label style={{ ...labelStyle, marginBottom: 8 }}>Date range</label>
      <div style={{ display: "flex", gap: 4, marginBottom: 10, background: "#E4E6DA", borderRadius: 10, padding: 3 }}>
        {rangeOptions.map((r) => (
          <button key={r.key} onClick={() => setRange(r.key)}
            style={{ flex: 1, padding: "7px 0", borderRadius: 8, border: "none", background: range === r.key ? "#FFFFFF" : "transparent", color: range === r.key ? "#1E2B22" : "#5B6459", fontWeight: 500, fontSize: 12.5, cursor: "pointer" }}>
            {r.label}
          </button>
        ))}
      </div>
      {range === "custom" && (
        <div style={{ display: "flex", gap: 8, marginBottom: 14 }}>
          <input type="date" style={{ ...inputStyle, flex: 1 }} value={customStart} max={customEnd || todayStr()} onChange={(e) => setCustomStart(e.target.value)} />
          <input type="date" style={{ ...inputStyle, flex: 1 }} value={customEnd} min={customStart} max={todayStr()} onChange={(e) => setCustomEnd(e.target.value)} />
        </div>
      )}

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 18, marginTop: 4 }}>
        <div style={{ background: "#FFFFFF", border: "1px solid #E4E6DA", borderRadius: 12, padding: "12px 14px" }}>
          <div style={{ fontSize: 12, color: "#5B6459" }}>Sessions logged</div>
          <div style={{ fontSize: 22, fontWeight: 500, color: "#1E2B22" }}>{rangedEntries.length}</div>
        </div>
        <div style={{ background: "#FFFFFF", border: "1px solid #E4E6DA", borderRadius: 12, padding: "12px 14px" }}>
          <div style={{ fontSize: 12, color: "#5B6459" }}>Covers</div>
          <div style={{ fontSize: 14, fontWeight: 500, color: "#1E2B22", marginTop: 3 }}>{firstDate ? `${fmtDate(firstDate)} – ${fmtDate(lastDate)}` : "No entries in range"}</div>
        </div>
      </div>

      {staleCats.length > 0 && (
        <div style={{ background: accentLight, borderRadius: 12, padding: "12px 14px", marginBottom: 18 }}>
          <div style={{ fontSize: 13, fontWeight: 500, color: accent, marginBottom: 4 }}>Could use attention</div>
          <div style={{ fontSize: 13, color: "#1E2B22" }}>
            {staleCats.map((c) => {
              const catEntries = entries.filter((e) => e.categoryId === c.id);
              if (catEntries.length === 0) return `${c.name} (never logged)`;
              const last = catEntries.map((e) => e.date).sort().slice(-1)[0];
              return `${c.name} (${daysSince(last)}d ago)`;
            }).join(" · ")}
          </div>
        </div>
      )}

      <div style={{ fontSize: 15, fontWeight: 500, color: "#1E2B22", marginBottom: 10 }}>Trends</div>
      <div style={{ marginBottom: 20 }}>
        {scopedCategories.map((cat) => {
          const rows = cat.fields.filter((f) => f.type !== "text").map((f) => ({ field: f, t: fieldTrend(rangedEntries, cat.id, f.id) }));
          const withTrend = rows.filter((r) => r.t);
          if (withTrend.length === 0) return null;
          return (
            <div key={cat.id} style={{ marginBottom: 18 }}>
              {scope === "all" && <div style={{ fontSize: 13, fontWeight: 500, color: "#5B6459", marginBottom: 6 }}>{cat.name}</div>}
              {withTrend.map(({ field, t }) => {
                const chartData = rangedEntries
                  .filter((e) => e.categoryId === cat.id && e.values[field.id] !== undefined && e.values[field.id] !== "")
                  .sort((a, b) => (a.date < b.date ? -1 : 1))
                  .map((e) => ({ date: fmtDate(e.date), value: Number(e.values[field.id]) }));
                return (
                  <div key={field.id} style={{ marginBottom: 12 }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "6px 0", fontSize: 13 }}>
                      <span style={{ color: "#1E2B22" }}>{field.label}</span>
                      <span style={{ display: "flex", alignItems: "center", gap: 6, color: "#5B6459" }}>
                        {t.a1.toFixed(1)} → {t.a2.toFixed(1)}{field.unit ? ` ${field.unit}` : ""} <TrendArrow delta={t.delta} />
                      </span>
                    </div>
                    <MiniChart data={chartData} color={accent} />
                  </div>
                );
              })}
            </div>
          );
        })}
        {scopedCategories.every((cat) => cat.fields.filter((f) => f.type !== "text").every((f) => !fieldTrend(rangedEntries, cat.id, f.id))) &&
          <p style={{ fontSize: 13, color: "#5B6459" }}>Not enough sessions in this range yet — log at least two per training, or widen the date range.</p>}
      </div>

      <div style={{ fontSize: 15, fontWeight: 500, color: "#1E2B22", marginBottom: 10 }}>Notes insights</div>

      {aiConfig?.apiKey ? (
        <React.Fragment>
          <button onClick={runAIAnalysis} disabled={aiLoading || notesEntries.length === 0}
            style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 6, width: "100%", padding: "11px", borderRadius: 10, border: "none", background: notesEntries.length === 0 ? "#EAEAE0" : accentLight, color: notesEntries.length === 0 ? "#A9AA9C" : accent, fontWeight: 500, fontSize: 14, cursor: notesEntries.length === 0 || aiLoading ? "default" : "pointer", marginBottom: 8 }}>
            {aiLoading && <span className="spin">⟳</span>}
            {aiLoading ? "Reading your notes…" : notesEntries.length === 0 ? "No notes in this range" : "✨ Analyze notes with AI"}
          </button>
          {aiError && <p style={{ fontSize: 13, color: "#B5432E", marginBottom: 8 }}>{aiError}</p>}
          {aiResult && (
            <div style={{ background: "#FFFFFF", border: "1px solid #E4E6DA", borderRadius: 12, padding: "14px 16px", fontSize: 14, lineHeight: 1.6, color: "#1E2B22", whiteSpace: "pre-wrap", marginBottom: 10 }}>
              {aiResult}
            </div>
          )}
          <button onClick={onOpenAISettings} style={{ border: "none", background: "transparent", color: "#8B8F7F", fontSize: 12, textDecoration: "underline", cursor: "pointer", padding: 0, marginBottom: 14 }}>
            AI settings ({PROVIDER_LABELS[aiConfig.provider]})
          </button>
        </React.Fragment>
      ) : (
        <React.Fragment>
          <p style={{ fontSize: 13, color: "#5B6459", marginBottom: 10 }}>
            Connect your own Claude, Gemini, or ChatGPT key to get patterns, triggers, and progress signals pulled from your notes automatically.
          </p>
          <button onClick={onOpenAISettings} style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 6, width: "100%", padding: "11px", borderRadius: 10, border: "none", background: accentLight, color: accent, fontWeight: 500, fontSize: 14, cursor: "pointer", marginBottom: 14 }}>
            ✨ Set up AI analysis
          </button>
        </React.Fragment>
      )}

      <p style={{ fontSize: 12, color: "#8B8F7F", marginBottom: 6 }}>Or just copy the notes and paste them anywhere yourself:</p>
      <button onClick={copyNotes} disabled={notesEntries.length === 0} style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 6, width: "100%", padding: "10px", borderRadius: 10, border: "1px solid #D7DACB", background: "transparent", color: notesEntries.length === 0 ? "#A9AA9C" : "#5B6459", fontWeight: 500, fontSize: 13, cursor: notesEntries.length === 0 ? "default" : "pointer" }}>
        {copied ? "Copied ✓" : notesEntries.length === 0 ? "No notes in this range" : `Copy ${notesEntries.length} note${notesEntries.length === 1 ? "" : "s"}`}
      </button>
    </div>
  );
}

function ManageDogsModal({ dogs, onClose, onAdd, onRename, onDelete }) {
  const [newName, setNewName] = useState("");
  const [names, setNames] = useState(() => Object.fromEntries(dogs.map((d) => [d.id, d.name])));
  const [confirmingId, setConfirmingId] = useState(null);

  const addDog = () => {
    if (!newName.trim()) return;
    onAdd(newName.trim());
    setNewName("");
  };

  return (
    <Modal title="Manage dogs" onClose={onClose}>
      {dogs.map((d) => (
        <div key={d.id} style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
          <input
            style={{ ...inputStyle, flex: 1 }}
            value={names[d.id] ?? d.name}
            onChange={(e) => setNames((n) => ({ ...n, [d.id]: e.target.value }))}
            onBlur={() => {
              const trimmed = (names[d.id] ?? "").trim();
              if (trimmed && trimmed !== d.name) onRename(d.id, trimmed);
            }}
          />
          {confirmingId === d.id ? (
            <React.Fragment>
              <button onClick={() => { onDelete(d.id); setConfirmingId(null); }} style={{ border: "none", background: "#B5432E", color: "#FFFFFF", fontSize: 12, fontWeight: 500, borderRadius: 6, padding: "8px 10px", cursor: "pointer", whiteSpace: "nowrap" }}>Delete</button>
              <button onClick={() => setConfirmingId(null)} style={{ border: "none", background: "transparent", color: "#5B6459", fontSize: 12, cursor: "pointer", padding: "8px 4px" }}>Cancel</button>
            </React.Fragment>
          ) : (
            <button onClick={() => setConfirmingId(d.id)} aria-label="Delete dog" style={{ border: "none", background: "transparent", color: "#B5432E", cursor: "pointer", fontSize: 16, padding: "8px 4px" }}>🗑</button>
          )}
        </div>
      ))}

      <div style={{ display: "flex", gap: 8, marginTop: 16 }}>
        <input
          style={{ ...inputStyle, flex: 1 }}
          placeholder="New dog's name"
          value={newName}
          onChange={(e) => setNewName(e.target.value)}
          onKeyDown={(e) => { if (e.key === "Enter") addDog(); }}
        />
        <button onClick={addDog} style={{ border: "none", background: "#1E2B22", color: "#FFFFFF", fontWeight: 500, fontSize: 14, borderRadius: 8, padding: "0 16px", cursor: "pointer" }}>Add</button>
      </div>
    </Modal>
  );
}

function App() {
  const [state, setStateRaw] = useState(loadState);
  const [activeDogId, setActiveDogId] = useState(() => loadState().dogs[0]?.id || null);
  const [view, setView] = useState("log");
  const [showAddCategory, setShowAddCategory] = useState(false);
  const [entryModalCategory, setEntryModalCategory] = useState(null);
  const [showManageDogs, setShowManageDogs] = useState(false);
  const [aiConfig, setAiConfig] = useState(loadAIConfig);
  const [showAISettings, setShowAISettings] = useState(false);
  const [saveFailed, setSaveFailed] = useState(false);

  const persist = (next) => {
    setStateRaw(next);
    const ok = saveState(next);
    setSaveFailed(!ok);
  };

  const dogAccents = {};
  const palette = [{ accent: "#4C6B4F", light: "#E3EADD" }, { accent: "#3E6690", light: "#DFE9F1" }, { accent: "#B5652E", light: "#F3E3D5" }, { accent: "#8B5A9E", light: "#EBE0F0" }];
  state.dogs.forEach((d, i) => (dogAccents[d.id] = palette[i % palette.length]));

  const activeDog = state.dogs.find((d) => d.id === activeDogId) || state.dogs[0];
  const accent = dogAccents[activeDog?.id]?.accent || "#4C6B4F";
  const accentLight = dogAccents[activeDog?.id]?.light || "#E3EADD";
  const dogCategories = state.categories.filter((c) => c.dogId === activeDog?.id);

  const addDog = (name) => {
    const newDog = { id: uid(), name };
    const withDog = { ...state, dogs: [...state.dogs, newDog] };
    const { state: patched } = ensureCoreCategories(withDog);
    persist(patched);
    setActiveDogId(newDog.id);
  };

  const renameDog = (dogId, name) => {
    persist({ ...state, dogs: state.dogs.map((d) => (d.id === dogId ? { ...d, name } : d)) });
  };

  const deleteDog = (dogId) => {
    const catIds = new Set(state.categories.filter((c) => c.dogId === dogId).map((c) => c.id));
    const nextDogs = state.dogs.filter((d) => d.id !== dogId);
    persist({
      ...state,
      dogs: nextDogs,
      categories: state.categories.filter((c) => c.dogId !== dogId),
      entries: state.entries.filter((e) => !catIds.has(e.categoryId)),
    });
    if (activeDogId === dogId) setActiveDogId(nextDogs[0]?.id || null);
  };

  const addCategory = ({ name, fields }) => {
    const newCat = { id: uid(), dogId: activeDog.id, name, fields };
    persist({ ...state, categories: [...state.categories, newCat] });
    setShowAddCategory(false);
  };

  const moveCategory = (catId, direction) => {
    const cats = [...state.categories];
    const dogId = cats.find((c) => c.id === catId)?.dogId;
    const dogCats = cats.filter((c) => c.dogId === dogId);
    const idx = dogCats.findIndex((c) => c.id === catId);
    const swapIdx = direction === "up" ? idx - 1 : idx + 1;
    if (swapIdx < 0 || swapIdx >= dogCats.length) return;
    const a = dogCats[idx], b = dogCats[swapIdx];
    const fullIdxA = cats.findIndex((c) => c.id === a.id);
    const fullIdxB = cats.findIndex((c) => c.id === b.id);
    [cats[fullIdxA], cats[fullIdxB]] = [cats[fullIdxB], cats[fullIdxA]];
    persist({ ...state, categories: cats });
  };

  const deleteCategory = (catId) => {
    persist({ ...state, categories: state.categories.filter((c) => c.id !== catId), entries: state.entries.filter((e) => e.categoryId !== catId) });
  };

  const addEntry = (categoryId, { date, values, notes }) => {
    const entry = { id: uid(), categoryId, date, values, notes };
    persist({ ...state, entries: [...state.entries, entry] });
    setEntryModalCategory(null);
  };

  const deleteEntry = (entryId) => {
    persist({ ...state, entries: state.entries.filter((e) => e.id !== entryId) });
  };

  return (
    <div style={{ background: "#EEF0E7", minHeight: "100vh", padding: "18px 16px 40px", boxSizing: "border-box" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 18 }}>
        <span style={{ fontSize: 20 }}>🐾</span>
        <h1 style={{ fontFamily: "'Fraunces', serif", fontSize: 22, fontWeight: 500, margin: 0, color: "#1E2B22" }}>Training tracker</h1>
      </div>

      {state.dogs.length === 0 ? (
        <div style={{ background: "#FFFFFF", border: "1px solid #E4E6DA", borderRadius: 14, padding: "28px 20px", textAlign: "center" }}>
          <div style={{ fontSize: 28, marginBottom: 8 }}>🐾</div>
          <p style={{ color: "#5B6459", fontSize: 14, marginBottom: 16 }}>Add your dog to start tracking training sessions.</p>
          <button onClick={() => setShowManageDogs(true)} style={{ border: "none", background: "#1E2B22", color: "#FFFFFF", fontWeight: 500, fontSize: 15, borderRadius: 10, padding: "12px 20px", cursor: "pointer" }}>
            + Add your first dog
          </button>
        </div>
      ) : (
        <React.Fragment>
          <div style={{ display: "flex", gap: 8, marginBottom: 8, overflowX: "auto", paddingBottom: 2 }}>
            {state.dogs.map((d) => {
              const isActive = d.id === activeDog?.id;
              const c = dogAccents[d.id];
              return (
                <button key={d.id} onClick={() => setActiveDogId(d.id)}
                  style={{ padding: "8px 16px", borderRadius: 999, border: isActive ? `2px solid ${c.accent}` : "1px solid #D7DACB", background: isActive ? c.light : "#FFFFFF", color: isActive ? c.accent : "#5B6459", fontWeight: 500, fontSize: 14, whiteSpace: "nowrap", cursor: "pointer" }}>
                  {d.name}
                </button>
              );
            })}
            <button onClick={() => setShowManageDogs(true)} aria-label="Add dog"
              style={{ padding: "8px 14px", borderRadius: 999, border: "1px dashed #B9BFAE", background: "transparent", color: "#5B6459", fontWeight: 500, fontSize: 14, whiteSpace: "nowrap", cursor: "pointer" }}>
              +
            </button>
          </div>
          <button onClick={() => setShowManageDogs(true)} style={{ border: "none", background: "transparent", color: "#8B8F7F", fontSize: 12, textDecoration: "underline", cursor: "pointer", padding: 0, marginBottom: 18 }}>
            Manage dogs
          </button>

          <div style={{ display: "flex", gap: 4, marginBottom: 18, background: "#E4E6DA", borderRadius: 10, padding: 3 }}>
            {[{ key: "log", label: "Log" }, { key: "insights", label: "Insights" }].map((t) => (
              <button key={t.key} onClick={() => setView(t.key)}
                style={{ flex: 1, padding: "8px 0", borderRadius: 8, border: "none", background: view === t.key ? "#FFFFFF" : "transparent", color: view === t.key ? "#1E2B22" : "#5B6459", fontWeight: 500, fontSize: 14, cursor: "pointer" }}>
                {t.label}
              </button>
            ))}
          </div>

          {view === "log" ? (
            <React.Fragment>
              {dogCategories.length === 0 && <p style={{ color: "#5B6459", fontSize: 14, marginBottom: 16 }}>No trainings set up for {activeDog?.name} yet. Add one below to start logging sessions.</p>}
              {dogCategories.map((cat, idx) => (
                <CategoryCard key={cat.id} category={cat} entries={state.entries.filter((e) => e.categoryId === cat.id)} accent={accent} accentLight={accentLight}
                  onAddEntry={() => setEntryModalCategory(cat)} onDeleteEntry={deleteEntry} onDeleteCategory={() => deleteCategory(cat.id)}
                  onMoveUp={() => moveCategory(cat.id, "up")} onMoveDown={() => moveCategory(cat.id, "down")} isFirst={idx === 0} isLast={idx === dogCategories.length - 1} />
              ))}
              <button onClick={() => setShowAddCategory(true)} style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 6, width: "100%", padding: "13px", borderRadius: 12, border: "1px dashed #B9BFAE", background: "transparent", color: "#1E2B22", fontWeight: 500, fontSize: 15, cursor: "pointer", marginTop: 6 }}>
                + New training for {activeDog?.name}
              </button>
            </React.Fragment>
          ) : (
            activeDog && <AnalysisView dog={activeDog} categories={dogCategories} entries={state.entries.filter((e) => dogCategories.some((c) => c.id === e.categoryId))} accent={accent} accentLight={accentLight} aiConfig={aiConfig} onOpenAISettings={() => setShowAISettings(true)} />
          )}
        </React.Fragment>
      )}

      {saveFailed && (
        <p style={{ color: "#B5432E", fontSize: 13, marginTop: 12 }}>
          Couldn't save to this device's storage (it may be full or in private browsing mode). Your changes are showing but may not survive closing the app.
        </p>
      )}

      {showAddCategory && <AddCategoryModal dogName={activeDog?.name} onClose={() => setShowAddCategory(false)} onSave={addCategory} />}
      {entryModalCategory && <AddEntryModal category={entryModalCategory} onClose={() => setEntryModalCategory(null)} onSave={(payload) => addEntry(entryModalCategory.id, payload)} />}
      {showManageDogs && (
        <ManageDogsModal
          dogs={state.dogs}
          onClose={() => setShowManageDogs(false)}
          onAdd={addDog}
          onRename={renameDog}
          onDelete={deleteDog}
        />
      )}
      {showAISettings && (
        <AISettingsModal
          config={aiConfig}
          onClose={() => setShowAISettings(false)}
          onSave={(cfg) => { saveAIConfig(cfg); setAiConfig(cfg); setShowAISettings(false); }}
          onRemove={() => { clearAIConfig(); setAiConfig(null); setShowAISettings(false); }}
        />
      )}
    </div>

  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
