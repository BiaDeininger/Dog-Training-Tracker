<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Dog Training Tracker</title>

<!-- Home screen / PWA behavior -->
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Dog Training" />
<meta name="theme-color" content="#4C6B4F" />

<link rel="stylesheet" href="style.css?v=14" />

<!--
  React, ReactDOM and Babel Standalone are vendored under vendor/ instead of
  loaded from a CDN, so the app has no runtime dependency on any external
  host reachable at load time (some sandboxes/CI environments block CDN
  domains outright). These are the unmodified react@18.3.1,
  react-dom@18.3.1 and @babel/standalone@7.24.7 UMD builds, byte-for-byte
  identical to what jsdelivr serves (verified against the previous
  `integrity` hashes before switching). To upgrade, pull the new version's
  UMD build via `npm pack <pkg>@<version>` (npm's registry is allowlisted
  even where CDNs aren't) and replace the file here.
-->
<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<!-- Lets us write the app below as plain JSX with no install/build step: -->
<!-- this transforms it to JS in the browser right before it runs. -->
<script src="vendor/babel.min.js"></script>
<script>
  // Built with textContent rather than innerHTML so an error message can never
  // be treated as markup.
  window.addEventListener("error", function (e) {
    var root = document.getElementById("root");
    if (!root || root.dataset.mounted) return;

    function line(text, style) {
      var el = document.createElement("div");
      el.setAttribute("style", style);
      el.textContent = text;
      return el;
    }

    var box = document.createElement("div");
    box.setAttribute("style", "padding:24px 20px;font-family:sans-serif;color:#1E2B22;");
    box.appendChild(line("Something failed to load", "font-weight:600;margin-bottom:8px;"));
    box.appendChild(line(e.message || "Unknown error", "font-size:13px;color:#5B6459;margin-bottom:14px;"));
    box.appendChild(line(
      "Try reloading. If this keeps happening, check your internet connection.",
      "font-size:13px;color:#5B6459;"
    ));

    root.textContent = "";
    root.appendChild(box);
  });
</script>
</head>
<body>
<div id="root">
  <div style="padding:40px 20px;text-align:center;font-family:sans-serif;color:#5B6459;">Loading…</div>
</div>

<!--
  The app is split into small files under src/ so changes stay easy to review
  in pull requests. They all run as plain (non-module) scripts sharing one
  global scope, in this load order, so later files can use anything defined
  by earlier ones — see the comment at the top of each file for what it owns.

  The "?v=" on each one is a cache-buster: browsers (and GitHub Pages' CDN)
  can hold on to an old copy of these files well after a new version is
  live, since nothing about the URL itself changed. Bumping this number on
  any change to src/ forces every visitor to fetch the new file instead of
  a stale cached one.
-->
<script type="text/babel" data-presets="react" src="src/utils.js?v=23"></script>
<script type="text/babel" data-presets="react" src="src/trainingTemplates.js?v=23"></script>
<script type="text/babel" data-presets="react" src="src/storage.js?v=23"></script>
<script type="text/babel" data-presets="react" src="src/ai.js?v=23"></script>
<script type="text/babel" data-presets="react" src="src/ui.jsx?v=23"></script>
<script type="text/babel" data-presets="react" src="src/CategoryCard.jsx?v=23"></script>
<script type="text/babel" data-presets="react" src="src/AddCategoryModal.jsx?v=23"></script>
<script type="text/babel" data-presets="react" src="src/AddEntryModal.jsx?v=23"></script>
<script type="text/babel" data-presets="react" src="src/AISettingsModal.jsx?v=23"></script>
<script type="text/babel" data-presets="react" src="src/ManageDogsModal.jsx?v=23"></script>
<script type="text/babel" data-presets="react" src="src/BackupReminderModal.jsx?v=23"></script>
<script type="text/babel" data-presets="react" src="src/AboutModal.jsx?v=23"></script>
<script type="text/babel" data-presets="react" src="src/ImageCropModal.jsx?v=23"></script>
<script type="text/babel" data-presets="react" src="src/DogProfileView.jsx?v=23"></script>
<script type="text/babel" data-presets="react" src="src/AnalysisView.jsx?v=23"></script>
<script type="text/babel" data-presets="react" src="src/App.jsx?v=23"></script>
</body>
</html>
