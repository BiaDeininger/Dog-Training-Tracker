<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Dog Training Tracker</title>

<!-- Home screen / PWA behavior -->
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Dog Training" />
<meta name="theme-color" content="#4C6B4F" />

<link rel="stylesheet" href="style.css" />

<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<!-- Lets us write the app below as plain JSX with no install/build step: -->
<!-- this transforms it to JS in the browser right before it runs. -->
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.7/babel.min.js"></script>
<script>
  window.addEventListener("error", function (e) {
    var root = document.getElementById("root");
    if (root && !root.dataset.mounted) {
      root.innerHTML =
        '<div style="padding:24px 20px;font-family:sans-serif;color:#1E2B22;">' +
        '<div style="font-weight:600;margin-bottom:8px;">Something failed to load</div>' +
        '<div style="font-size:13px;color:#5B6459;margin-bottom:14px;">' + (e.message || "Unknown error") + '</div>' +
        '<div style="font-size:13px;color:#5B6459;">Try reloading. If this keeps happening, check your internet connection.</div>' +
        '</div>';
    }
  });
</script>
</head>
<body>
<div id="root">
  <div style="padding:40px 20px;text-align:center;font-family:sans-serif;color:#5B6459;">Loading…</div>
</div>

<!--
  The app is split into small files under src/ so changes stay easy to review
  in pull requests. They all run as plain (non-module) scripts sharing one
  global scope, in this load order, so later files can use anything defined
  by earlier ones — see the comment at the top of each file for what it owns.
-->
<script type="text/babel" data-presets="react" src="src/utils.js"></script>
<script type="text/babel" data-presets="react" src="src/storage.js"></script>
<script type="text/babel" data-presets="react" src="src/ai.js"></script>
<script type="text/babel" data-presets="react" src="src/ui.jsx"></script>
<script type="text/babel" data-presets="react" src="src/CategoryCard.jsx"></script>
<script type="text/babel" data-presets="react" src="src/AddCategoryModal.jsx"></script>
<script type="text/babel" data-presets="react" src="src/AddEntryModal.jsx"></script>
<script type="text/babel" data-presets="react" src="src/AISettingsModal.jsx"></script>
<script type="text/babel" data-presets="react" src="src/ManageDogsModal.jsx"></script>
<script type="text/babel" data-presets="react" src="src/AnalysisView.jsx"></script>
<script type="text/babel" data-presets="react" src="src/App.jsx"></script>
</body>
</html>
